name: Guardian Android (debug build)
on:
  push:
    branches: [ main, feat/csn-guardian-dpc ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/guardian-android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/guardian-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Required SDK components already present"
          else
            SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
            test -n "$SDK_MANAGER"
            "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and compile debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload unsigned-for-release debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: csn-guardian-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
